<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PerfCompare has moved</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="3;url=https://perf.compare/">
<script>
  // Preserve path, query and hash; drop the GitHub Pages /perfcompare prefix.
  var path = location.pathname.replace(/^\/perfcompare(?=\/|$)/, "");
  if (path === "/index.html" || path === "/404.html") path = "/";
  location.replace("https://perf.compare" + path + location.search + location.hash);
</script>
</head>
<body>
<p>The prototype has been merged upstream. Continue to
<a href="https://perf.compare/">perf.compare</a>.</p>
</body>
</html>
